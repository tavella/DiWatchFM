name: DiWatchFM
options:
  bundleIdPrefix: $(ORGANIZATION_IDENTIFIER)
configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig
targets:
  DiPhoneFM:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DiPhoneFM
      - path: DiWatchFM/KeychainManager.swift
    dependencies:
      - target: DiWatchApp
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORGANIZATION_IDENTIFIER).DiFM
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS:
          - iphoneos
          - iphonesimulator
        VALIDATE_WORKSPACE: NO
        ENABLE_ONLY_ACTIVE_RESOURCES: YES
  DiWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: DiWatchFM
        excludes:
          - Info.plist
    info:
      path: DiWatchFM/Info.plist
      properties:
        WKBackgroundModes: [audio]
        UIBackgroundModes: [audio]
        WKWatchOnly: false
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: $(ORGANIZATION_IDENTIFIER).DiFM
        CFBundleIdentifier: $(ORGANIZATION_IDENTIFIER).DiFM.watchkitapp
        CFBundleName: DiWatchFM
        CFBundleDisplayName: DiWatchFM
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
          NSExceptionDomains:
            di.fm:
              NSIncludesSubdomains: true
              NSTemporaryExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORGANIZATION_IDENTIFIER).DiFM.watchkitapp
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SUPPORTED_PLATFORMS:
          - watchos
          - watchsimulator
        VALIDATE_WORKSPACE: NO
        ENABLE_ONLY_ACTIVE_RESOURCES: YES
  DiWatchAppTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: DiWatchFMTests
    dependencies:
      - target: DiWatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORGANIZATION_IDENTIFIER).DiWatchFMTests
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS:
          - watchos
          - watchsimulator
schemes:
  DiWatchFM:
    build:
      targets:
        DiPhoneFM: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
  DiWatchApp:
    build:
      targets:
        DiWatchApp: all
        DiWatchAppTests: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DiWatchAppTests
    archive:
      config: Release
